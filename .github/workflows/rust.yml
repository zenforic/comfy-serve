name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false
    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build
    - name: Build backend
      run: cargo test --verbose
